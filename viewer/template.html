<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apollo Signet Ring, 3D viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 42%, #3d2c31 0%, #271c20 52%, #160f12 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #eadccb;
  }
  canvas { display: block; touch-action: none; }
  #title { position: fixed; top: 14px; left: 18px; pointer-events: none; }
  #title h1 { margin: 0; font: 600 15px/1.2 Georgia, "Times New Roman", serif; letter-spacing: .14em; text-transform: uppercase; color: #f1dfb4; }
  #title p { margin: 5px 0 0; font-size: 12px; color: #bba99a; }
  #hint { position: fixed; top: 16px; right: 18px; font-size: 12px; color: #bba99a; pointer-events: none; }
  #bar { position: fixed; left: 12px; bottom: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  #bar button {
    background: rgba(22, 15, 17, .74); color: #efe2d0; border: 1px solid rgba(255, 232, 196, .22); border-radius: 3px;
    padding: 8px 13px; font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; cursor: pointer;
  }
  #bar button:hover { background: rgba(72, 54, 45, .86); }
  #bar button.on { background: rgba(128, 94, 58, .88); border-color: rgba(255, 220, 160, .55); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 13px; letter-spacing: .12em; color: #bba99a; }
</style>
</head>
<body>
<div id="loading">LOADING RING&hellip;</div>
<div id="title"><h1>Apollo Signet</h1><p>Roman type &middot; gold &amp; carnelian &middot; US __SIZE__</p></div>
<div id="hint">Drag to turn &middot; scroll or pinch to zoom</div>
<div id="bar">
  <button data-view="three">&frac34; view</button>
  <button data-view="face">Bezel face</button>
  <button data-view="portrait">Portrait</button>
  <button data-view="profile">Profile</button>
  <button data-view="side">Side</button>
  <button id="turn">Turntable</button>
  <button id="lift">Lift stone</button>
</div>
<script>window.RING_DATA = __DATA__;</script>
<script>__BUNDLE__</script>
</body>
</html>
